name: Apply reviewed source fixes
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor == 'Karthikvk1899'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply reviewed source patch
        run: |
          python3 - <<'PYTHON'
          import base64,json,zlib,pathlib
          data=json.loads(zlib.decompress(base64.b64decode('')))
          for name,content in data['files'].items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not name.startswith('.github/workflows/')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content)
          for name in data['deleted']:
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not name.startswith('.github/workflows/')
              p.unlink(missing_ok=True)
          PYTHON
          git config user.name 'Karthik Beesa'
          git config user.email '261053759+Karthikvk1899@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Fix safety behavior, dependency hygiene, and verification coverage'
          git push
