name: Repository maintenance
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Preserve current source in a clean initial commit
        env:
          GIT_AUTHOR_NAME: Karthik Beesa
          GIT_AUTHOR_EMAIL: Karthikvk1899@users.noreply.github.com
          GIT_COMMITTER_NAME: Karthik Beesa
          GIT_COMMITTER_EMAIL: Karthikvk1899@users.noreply.github.com
        run: |
          set -euo pipefail
          previous=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          clean=$(printf '%s\n' 'Initial release of Quota Forge' | git commit-tree "$tree")
          git diff --exit-code "$previous" "$clean"
          git push --force-with-lease="refs/heads/main:$previous" origin "$clean:refs/heads/main"
